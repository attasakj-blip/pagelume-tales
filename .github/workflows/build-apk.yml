name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
      - name: Restore the Play upload key
        if: env.UPLOAD_KEYSTORE_PASSWORD != ''
        run: echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
      - run: flutter pub get
      - run: flutter test
      # One APK per CPU type: arm64 for most phones, armv7 for very old ones.
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --build-number ${{ github.run_number }}
      - if: env.UPLOAD_KEYSTORE_PASSWORD != ''
        run: flutter build appbundle --release --build-number ${{ github.run_number }}
      - name: Collect files
        run: |
          mkdir out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/pagelume-tales-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/pagelume-tales-armv7.apk
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab out/pagelume-tales.aab
          fi
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: pagelume-tales
          path: out/
      # Keep the latest build on a branch named "apk" (easy for Claude to fetch).
      - name: Publish to the apk branch
        run: |
          cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -q -m "Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
      # A release named "latest": the easiest link to download on a phone.
      - name: Publish the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/* --title "Pagelume Tales build ${GITHUB_RUN_NUMBER}" \
            --notes "Download pagelume-tales-arm64.apk for most phones, or pagelume-tales-armv7.apk for very old phones." --latest
