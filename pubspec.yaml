name: pagelume_tales
description: "Pagelume Tales: picture story books that turn like real pages and read aloud."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_tts: ^4.2.5
  audioplayers: ^6.7.1
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon_512.png
    - assets/sounds/
    - assets/stories/turnip/
  fonts:
    - family: Mali
      fonts:
        - asset: assets/fonts/Mali-Regular.ttf
        - asset: assets/fonts/Mali-SemiBold.ttf
          weight: 600
